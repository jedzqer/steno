<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steno · 视频速记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6bff'/%3E%3Cstop offset='1' stop-color='%234cc3ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cg stroke='white' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='15' y1='25' x2='15' y2='39'/%3E%3Cline x1='26' y1='16' x2='26' y2='48'/%3E%3Cline x1='37' y1='23' x2='37' y2='41'/%3E%3Cline x1='48' y1='18' x2='48' y2='46'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="app">

  <!-- ======================= 侧边栏 ======================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="9.5" x2="4" y2="14.5"/><line x1="8" y1="6" x2="8" y2="18"/>
          <line x1="12" y1="8.5" x2="12" y2="15.5"/><line x1="16" y1="4.5" x2="16" y2="19.5"/>
          <line x1="20" y1="10" x2="20" y2="14"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Steno</h1>
        <p>视频 · 音频 · 一键转文字</p>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        新建转录
      </button>
      <button class="nav-item" data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        历史记录
        <span class="count" id="histCount"></span>
      </button>
    </nav>

    <div class="sys">
      <div class="sys-title">系统状态</div>
      <div class="chips" id="sysChips"><span class="chip idle"><i></i>检测中…</span></div>
    </div>

    <div class="side-foot">
      <button class="ghost-btn" id="openFolderBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
        打开输出目录
      </button>
      <button class="ghost-btn danger" id="quitBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.5a8 8 0 1 0 11.4 0"/></svg>
        退出服务
      </button>
      <div class="foot-url" id="footUrl"></div>
    </div>
  </aside>

  <!-- ======================= 主区域 ======================= -->
  <main class="main">

    <!-- 新建转录 -->
    <section class="view" id="viewNew">
      <header class="hero">
        <h2>把<em>视频与音频</em>，变成文字。</h2>
        <p>上传本地文件或粘贴视频链接，SenseVoice 在本机完成转录——数据不出你的电脑。</p>
      </header>

      <div class="card input-card">
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13.5 3.5V9H19"/></svg>
            本地文件
          </button>
          <button class="tab" data-tab="url">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4.4l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4L11.4 6.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4-.4L5 12.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>
            视频链接
          </button>
        </div>

        <div class="pane" id="paneFile">
          <div class="dropzone" id="dropZone" tabindex="0" role="button" aria-label="选择或拖放文件">
            <input type="file" id="fileInput" hidden>
            <div class="dz-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4.5"/><path d="m7.5 9 4.5-4.5L16.5 9"/><path d="M4 15v3a2.5 2.5 0 0 0 2.5 2.5h11A2.5 2.5 0 0 0 20 18v-3"/></svg>
            </div>
            <b>拖放视频 / 音频到这里</b>
            <span>或点击选择文件 · mp4 mkv mov webm mp3 wav flac m4a …</span>
          </div>
          <div class="file-chip hidden" id="fileChip">
            <div class="fc-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13.5 3.5V9H19"/></svg>
            </div>
            <div class="fc-info"><b id="chipName"></b><span id="chipMeta"></span></div>
            <button class="icon-btn" id="chipRemove" title="移除文件">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>

        <div class="pane hidden" id="paneUrl">
          <div class="url-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4.4l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4L11.4 6.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4-.4L5 12.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>
            <input id="urlInput" type="text" spellcheck="false" autocomplete="off"
                   placeholder="粘贴视频链接：YouTube / B站 / Twitter 等数千站点">
          </div>
          <div class="url-opts">
            <label class="check">
              <input type="checkbox" id="audioOnly" checked><span class="box"></span>
              仅下载音轨（更快、更省空间）
            </label>
            <div class="opt inline">
              <label for="cookiesFrom">会员 / 登录站点</label>
              <select id="cookiesFrom">
                <option value="">不需要</option>
                <option value="chrome">Chrome</option>
                <option value="edge">Edge</option>
                <option value="firefox">Firefox</option>
              </select>
            </div>
          </div>
        </div>

        <div class="opts-row">
          <div class="opt">
            <label for="lang">语言</label>
            <select id="lang">
              <option value="zh" selected>中文</option>
              <option value="en">English</option>
              <option value="yue">粤语</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="auto">自动检测</option>
            </select>
          </div>
          <div class="opt">
            <label for="device">推理设备</label>
            <select id="device">
              <option value="auto" selected>自动</option>
              <option value="cuda:0">GPU (CUDA)</option>
              <option value="cpu">CPU</option>
            </select>
          </div>
          <label class="check itn">
            <input type="checkbox" id="useItn" checked><span class="box"></span>
            智能标点与数字规整
          </label>
          <details class="adv">
            <summary>高级参数</summary>
            <div class="adv-grid">
              <div class="opt"><label for="chunk">分块时长（秒）</label><input type="number" id="chunk" value="120" min="30" max="600" step="10"></div>
              <div class="opt"><label for="overlap">分块重叠（秒）</label><input type="number" id="overlap" value="1" min="0" max="30" step="1"></div>
            </div>
          </details>
        </div>

        <div class="start-row">
          <button class="btn-primary" id="startBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg>
            开始转录
          </button>
          <span class="hint" id="startHint"></span>
        </div>
      </div>

      <div class="hidden" id="jobsWrap">
        <h3 class="sec-title">任务</h3>
        <div id="jobList"></div>
      </div>

      <div class="hidden" id="resultWrap">
        <div class="result-head">
          <h3 class="sec-title" id="resultTitle">转录结果</h3>
          <div class="result-actions">
            <span class="char-count" id="charCount"></span>
            <button class="ghost-btn" id="copyBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
              复制
            </button>
            <button class="ghost-btn" id="dlBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10.5 5 5 5-5"/><path d="M5 19.5h14"/></svg>
              下载 .txt
            </button>
          </div>
        </div>
        <div class="card result-card"><div class="result-text" id="resultText"></div></div>
      </div>
    </section>

    <!-- 历史记录 -->
    <section class="view hidden" id="viewHistory">
      <header class="hero">
        <h2>历史记录</h2>
        <p><code>videos/</code> 目录下的全部转录结果，点击卡片查看全文。</p>
      </header>
      <div class="hist-toolbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        <input id="histSearch" type="text" placeholder="搜索文件名…" autocomplete="off">
      </div>
      <div class="hist-grid" id="histGrid"></div>
    </section>

  </main>
</div>

<!-- 结果弹窗 -->
<div class="modal-backdrop hidden" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="mh-info"><b id="modalTitle"></b><span id="modalMeta"></span></div>
      <button class="icon-btn" id="modalClose" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="result-text modal-text" id="modalText"></div>
    <div class="modal-foot">
      <button class="ghost-btn danger" id="modalDelete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9 6V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6"/><path d="M6.5 6.5 7.4 19a2 2 0 0 0 2 1.9h5.2a2 2 0 0 0 2-1.9l.9-12.5"/></svg>
        删除记录
      </button>
      <div class="mf-right">
        <button class="ghost-btn" id="modalCopy">复制</button>
        <button class="ghost-btn" id="modalDl">下载 .txt</button>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
